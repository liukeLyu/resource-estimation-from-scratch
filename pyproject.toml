[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resource-estimation-from-scratch"
version = "0.1.0.dev0"
description = "Fault-tolerant resource estimation from scratch: every Toffoli in a qubitized phase estimation, built, counted and checked, up to a published FeMoco estimate"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Liuke Lyu" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
examples = ["jupyter", "matplotlib", "pennylane>=0.45", "openfermion[resources]>=1.6", "jax", "pyscf"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib", "nbclient", "ipykernel", "pennylane>=0.45", "openfermion[resources]>=1.6", "jax", "pyscf"]

[tool.hatch.build.targets.wheel]
packages = ["src/qcost"]

[tool.pytest.ini_options]
markers = ["slow: tens of seconds each (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]
